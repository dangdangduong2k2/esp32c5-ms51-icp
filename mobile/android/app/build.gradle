plugins {
    id 'com.android.application'
}

def localEndpoint = providers.gradleProperty('ms51LocalEndpoint').orNull
def localResources = providers.gradleProperty('ms51LocalResources').orNull
if (localEndpoint && (!localEndpoint.startsWith('https://') || !localResources)) {
    throw new GradleException('Local test builds require HTTPS and an explicit local CA resource directory')
}

android {
    namespace 'vn.duong.ms51control'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'vn.duong.ms51connect'
        minSdk 24
        targetSdk 35
        versionCode 62
        versionName '3.7.6'
        buildConfigField 'String', 'CLOUD_BASE_URL', groovy.json.JsonOutput.toJson(localEndpoint ?: 'https://103-9-78-139.sslip.io/ms51/connect/v1')
        manifestPlaceholders = [appLabel: localEndpoint ? 'Hẹn Giờ Lạnh Test' : 'Hẹn Giờ Lạnh']
        if (localEndpoint) {
            applicationIdSuffix '.localtest'
            versionNameSuffix '-local'
        }
        testInstrumentationRunner 'vn.duong.ms51control.CloudIntegrationTestRunner'
    }

    signingConfigs {
        debug {
            if (System.getenv('MS51_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('MS51_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    if (localEndpoint) {
        sourceSets.debug.res.srcDir(localResources)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
