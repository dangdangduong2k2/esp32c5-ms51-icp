plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.duong.ms51control'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.duong.ms51connect'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '3.0.0'
        testInstrumentationRunner 'vn.duong.ms51control.CloudIntegrationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
