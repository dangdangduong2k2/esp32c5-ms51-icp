plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.duong.ms51control'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.duong.ms51connect'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '3.1.1'
        testInstrumentationRunner 'vn.duong.ms51control.CloudIntegrationTestRunner'
    }

    signingConfigs {
        debug {
            if (System.getenv('MS51_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('MS51_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
